<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微風 Chat - Breeze Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0d1527 50%, #070b14 100%);
            --card-glass: rgba(23, 37, 67, 0.4);
            --border-glass: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(20, 184, 166, 0.25);
            --breeze-teal: #14b8a6;
            --breeze-cyan: #06b6d4;
            --breeze-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { background: var(--bg-gradient); font-family: 'Inter', 'Noto Sans TC', sans-serif; color: var(--text-main); min-height: 100vh; position: relative; }
        .brand-title { font-weight: 700; background: linear-gradient(135deg, #fff 0%, #a5f3fc 50%, #2dd4bf 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-glass { background: var(--card-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); }
        .nav-tabs .nav-link { color: var(--text-muted); border: none; padding: 14px 24px; }
        .nav-tabs .nav-link.active { color: #fff; background: rgba(20, 184, 166, 0.08); border-bottom: 3px solid var(--breeze-teal); }
        .chat-container { height: 400px; overflow-y: auto; background: rgba(8, 13, 24, 0.5); border: 1px solid var(--border-glass); padding: 24px; border-radius: 16px; }
        .msg-item { margin-bottom: 18px; padding: 12px 18px; border-radius: 16px; max-width: 72%; font-size: 14.5px; clear: both; }
        .msg-in { background-color: rgba(30, 41, 59, 0.8); color: #e2e8f0; float: left; border-bottom-left-radius: 4px; }
        .msg-out { background: linear-gradient(135deg, var(--breeze-teal), #0f766e); color: #fff; float: right; border-bottom-right-radius: 4px; }
        .msg-ai { background: rgba(6, 182, 212, 0.06); color: #e0f7fa; float: left; border-left: 4px solid var(--breeze-cyan); border-radius: 4px 16px 16px 16px; }
        .form-control { background-color: rgba(9, 15, 28, 0.7); border: 1px solid var(--border-glass); color: #fff; border-radius: 10px; padding: 12px 16px; }
        .form-control:focus { border-color: var(--breeze-teal); box-shadow: 0 0 0 3px var(--border-glow); background-color: rgba(7, 11, 20, 0.9); color: #fff; }
        .secret-key { background-color: #05070c; font-family: 'Fira Code', monospace; color: #2dd4bf; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto; border: 1px dashed rgba(45, 212, 191, 0.2); }
        .btn { border-radius: 10px; padding: 11px 20px; font-weight: 500; transition: all 0.25s; }
        .btn-breeze { background: linear-gradient(135deg, var(--breeze-teal), var(--breeze-cyan)); color: #fff; border: none; }
        .btn-breeze:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3); color: #fff; }
        .btn-outline-breeze { border: 1px solid var(--breeze-teal); color: var(--breeze-teal); background: transparent; }
        .hidden { display: none !important; }
        .fs-7 { font-size: 13px; }
        /* 6位數專用大輸入框 */
        .code-input { font-size: 24px; letter-spacing: 8px; text-align: center; font-family: 'Fira Code', monospace; color: var(--breeze-teal); }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 950px;">
    <div class="text-center mb-5">
        <h1 class="brand-title display-5 mb-2">🍃 微風 Chat</h1>
        <p class="text-secondary fs-5" style="font-weight: 300;">安全私訊終端 · 智慧 AI 助手</p>
    </div>

    <div id="alert-box" class="alert hidden text-center mb-4 card-glass border-0 py-3 fw-medium"></div>

    <div id="auth-section" class="card-glass p-4 p-md-5" style="max-width: 460px; margin: 0 auto;">
        <h3 class="mb-4 text-center fw-bold">帳號認證</h3>
        <div class="d-flex justify-content-center mb-4">
            <div class="btn-group w-100 p-1 bg-black bg-opacity-40 rounded-3" style="max-width: 240px;">
                <input type="radio" class="btn-check" name="authMode" id="mode-login" checked>
                <label class="btn btn-outline-light border-0 py-2 w-50 fs-7" for="mode-login">登入</label>
                <input type="radio" class="btn-check" name="authMode" id="mode-register">
                <label class="btn btn-outline-light border-0 py-2 w-50 fs-7" for="mode-register">註冊</label>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label text-light fs-7">電子信箱 Email</label>
            <input type="email" id="auth-email" class="form-control" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label class="form-label text-light fs-7">帳號密碼 (至少 6 碼)</label>
            <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
        </div>
        <div id="private-key-input-group" class="mb-4">
            <label class="form-label text-warning fs-7">🔑 導入您的「私鑰 (PEM)」以解密私訊 (選填)</label>
            <textarea id="login-private-key" class="form-control fs-7 text-muted" rows="3" placeholder="-----BEGIN PRIVATE KEY-----"></textarea>
        </div>
        <button id="btn-submit-auth" class="btn btn-breeze w-100 mb-3">🔓 驗證並進入終端</button>
    </div>

    <div id="verify-section" class="card-glass p-4 p-md-5 text-center hidden" style="max-width: 460px; margin: 0 auto;">
        <h3 class="text-warning mb-3 fw-bold">🔢 輸入 6 位數驗證碼</h3>
        <p class="text-secondary mb-4">我們已向您的電子信箱發送了安全驗證碼，請在下方輸入：</p>
        <div class="mb-4">
            <input type="text" id="input-verify-code" class="form-control code-input" maxlength="6" placeholder="000000">
        </div>
        <button id="btn-check-code" class="btn btn-breeze w-100 mb-3">✅ 提交驗證碼</button>
        <button id="btn-cancel-verify" class="btn btn-link text-secondary w-100 text-decoration-none fs-7">返回修改信箱</button>
    </div>

    <div id="main-section" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 card-glass rounded-3">
            <div class="fs-7">🍃 當前終端：<strong id="user-display-email" class="text-info"></strong></div>
            <button id="btn-logout" class="btn btn-sm btn-outline-danger px-3 py-1 fs-7">🚪 安全登出</button>
        </div>

        <ul class="nav nav-tabs mb-4 gap-1" id="mainTabs">
            <li class="nav-item"><button class="nav-link active" id="tab-ai" data-bs-toggle="tab" data-bs-target="#panel-ai" type="button">🤖 微風 AI 智慧助手</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-group" data-bs-toggle="tab" data-bs-target="#panel-group" type="button">👥 公開大群組</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-pm" data-bs-toggle="tab" data-bs-target="#panel-pm" type="button">🔒 密鑰私訊 (E2EE)</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-key" data-bs-toggle="tab" data-bs-target="#panel-key" type="button">🔑 金鑰備份</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active card-glass p-4" id="panel-ai">
                <h4 class="mb-3 fw-bold text-info fs-5">🤖 微風 AI 智慧對話</h4>
                <div class="chat-container mb-3" id="chat-ai-box">
                    <div class="msg-item msg-ai">你好！我是你的 微風 AI 助理，隨時準備好為您解答任何疑問。🍃</div>
                </div>
                <div class="input-group gap-2">
                    <input type="text" id="input-ai-msg" class="form-control" placeholder="輸入您的提問...">
                    <button id="btn-send-ai" class="btn btn-breeze px-4">問問 AI</button>
                </div>
            </div>
            <div class="tab-pane fade card-glass p-4" id="panel-group">
                <h4 class="mb-3 fw-bold text-primary fs-5" style="color: var(--breeze-blue) !important;">👥 公開大群組聊天室</h4>
                <div class="chat-container mb-3" id="chat-group-box"></div>
                <div class="input-group gap-2">
                    <input type="text" id="input-group-msg" class="form-control" placeholder="發送公開廣播訊息...">
                    <button id="btn-send-group" class="btn btn-breeze px-4" style="background: linear-gradient(135deg, var(--breeze-blue), #1d4ed8);">發送</button>
                </div>
            </div>
            <div class="tab-pane fade card-glass p-4" id="panel-pm">
                <h4 class="mb-3 fw-bold text-success fs-5" style="color: var(--breeze-teal) !important;">🔒 安全加密私訊 (E2EE)</h4>
                <div class="mb-3">
                    <label class="form-label text-secondary fs-7">收件者唯一 Email 地址</label>
                    <input type="email" id="pm-target-email" class="form-control" placeholder="friend@mail.com">
                </div>
                <div class="chat-container mb-3" id="chat-pm-box"></div>
                <div class="input-group gap-2">
                    <input type="text" id="input-pm-msg" class="form-control" placeholder="輸入私密訊息...">
                    <button id="btn-send-pm" class="btn btn-breeze px-4">加密發送</button>
                </div>
            </div>
            <div class="tab-pane fade card-glass p-4" id="panel-key">
                <h4 class="text-danger mb-3 fw-bold fs-5">⚠️ 私密金鑰安全保管警告</h4>
                <div id="backup-private-key" class="secret-key p-3 rounded-3 mb-3"></div>
                <button id="btn-download-key" class="btn btn-outline-breeze fs-7">下載私鑰安全備份 (.txt)</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 配置
    const firebaseConfig = {
        apiKey: "AIzaSyBMxdzzFR7wuocXEMOYciw2PPJleuRevOw",
        authDomain: "weifengai-ef11f.firebaseapp.com",
        projectId: "weifengai-ef11f",
        storageBucket: "weifengai-ef11f.firebasestorage.app",
        messagingSenderId: "474059699642",
        appId: "1:474059699642:web:b40a3d32be1cd583199983",
        measurementId: "G-N1TYXP9EWQ"
    };
    const GEMINI_API_KEY = "AIzaSyATX9erM04VfUR_N0io0hwA51XA9IiYf4s";

    // 🛠️ 【已為您自動填入 EmailJS 金鑰資訊】 
    const EMAILJS_PUBLIC_KEY = "yfj2SpO34fRfr2rYa"; 
    const EMAILJS_SERVICE_ID = "service_7qmo2uh";
    const EMAILJS_TEMPLATE_ID = "contact_form";

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let localPrivateKey = "";
    let currentUserUid = "";
    let currentUserEmail = "";
    let tempRegEmail = "";
    let tempRegPassword = "";

    const authSection = document.getElementById('auth-section');
    const verifySection = document.getElementById('verify-section');
    const mainSection = document.getElementById('main-section');
    const modeLogin = document.getElementById('mode-login');
    const modeRegister = document.getElementById('mode-register');
    const privateKeyGroup = document.getElementById('private-key-input-group');
    const btnSubmitAuth = document.getElementById('btn-submit-auth');
    const alertBox = document.getElementById('alert-box');

    modeLogin.addEventListener('change', () => { privateKeyGroup.classList.remove('hidden'); });
    modeRegister.addEventListener('change', () => { privateKeyGroup.classList.add('hidden'); });
    function showAlert(msg, type="info") { alertBox.className = `alert alert-${type} text-center card-glass py-3 fw-medium`; alertBox.innerText = msg; alertBox.classList.remove('hidden'); }
    function hideAlert() { alertBox.classList.add('hidden'); }

    // 驗證與註冊分流
    btnSubmitAuth.addEventListener('click', async () => {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if(!email || password.length < 6) { alert("請填入完整信箱及至少 6 位數密碼。"); return; }

        if (modeRegister.checked) {
            try {
                btnSubmitAuth.disabled = true;
                // 1. 生成 6 位數驗證碼
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                // 2. 暫存寫入 Firestore 待驗證
                await setDoc(doc(db, "verification_codes", email), { code: code, timestamp: Date.now() });
                // 3. 發送郵件
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: email, verification_code: code });
                
                tempRegEmail = email;
                tempRegPassword = password;
                authSection.classList.add('hidden');
                verifySection.classList.remove('hidden');
                showAlert("🔢 6 位數驗證碼已發送至您的信箱，請查看輸入！", "warning");
            } catch (e) { alert("發送失敗: " + e.message); }
            finally { btnSubmitAuth.disabled = false; }
        } else {
            const inputKey = document.getElementById('login-private-key').value.trim();
            try {
                btnSubmitAuth.disabled = true;
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                localPrivateKey = inputKey;
                hideAlert();
                enterMain(userCred.user.uid, userCred.user.email);
            } catch (e) { alert("登入失敗，請確認帳密或該帳號已完成認證: " + e.message); }
            finally { btnSubmitAuth.disabled = false; }
        }
    });

    // 比對 6 位數驗證碼
    document.getElementById('btn-check-code').addEventListener('click', async () => {
        const inputCode = document.getElementById('input-verify-code').value.trim();
        if(inputCode.length !== 6) { alert("請輸入完整的 6 位數驗證碼。"); return; }

        const codeDoc = await getDoc(doc(db, "verification_codes", tempRegEmail));
        if (codeDoc.exists() && codeDoc.data().code === inputCode) {
            try {
                // 驗證碼正確，正式在 Firebase 建立帳號
                const userCred = await createUserWithEmailAndPassword(auth, tempRegEmail, tempRegPassword);
                const user = userCred.user;
                
                // 自動產生安全私鑰
                const crypt = new JSEncrypt({ default_key_size: 2048 });
                crypt.getKey();
                localPrivateKey = crypt.getPrivateKey();
                
                await setDoc(doc(db, "users", user.uid), { email: user.email, public_key: crypt.getPublicKey() });
                verifySection.classList.add('hidden');
                hideAlert();
                enterMain(user.uid, user.email);
                alert("🎉 驗證成功！已成功開通並為您建立端到端加密金鑰。");
            } catch(e) { alert("建立帳號失敗: " + e.message); }
        } else {
            alert("❌ 驗證碼錯誤，請重新確認郵件！");
        }
    });

    document.getElementById('btn-cancel-verify').addEventListener('click', () => { location.reload(); });
    document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth); location.reload(); });

    function enterMain(uid, email) {
        currentUserUid = uid; currentUserEmail = email;
        document.getElementById('user-display-email').innerText = email;
        authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        document.getElementById('backup-private-key').innerText = localPrivateKey || "（當前未提供個人私鑰，私密加密訊息功能將無法解密讀取）";
        startGroupChatListener(); startPMChatListener();
    }

    // ================= 微風 AI 智慧對話 =================
    document.getElementById('btn-send-ai').addEventListener('click', async () => {
        const inputEl = document.getElementById('input-ai-msg'); const prompt = inputEl.value.trim(); if (!prompt) return;
        const aiBox = document.getElementById('chat-ai-box'); aiBox.innerHTML += `<div class="msg-item msg-out">${prompt}</div>`;
        inputEl.value = ""; aiBox.scrollTop = aiBox.scrollHeight;
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json(); const aiText = data.candidates[0].content.parts[0].text;
            aiBox.innerHTML += `<div class="msg-item msg-ai">🍃 ${aiText}</div>`;
        } catch (e) { aiBox.innerHTML += `<div class="msg-item msg-ai text-danger">🍃 思考中斷。</div>`; }
        aiBox.scrollTop = aiBox.scrollHeight;
    });

    // ================= 公開群組聊天室 =================
    function startGroupChatListener() {
        const q = query(collection(db, "group_messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('chat-group-box'); box.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data(); const isMe = data.sender === currentUserEmail;
                box.innerHTML += `<div class="msg-item ${isMe ? 'msg-out' : 'msg-in'}"><small class="text-secondary d-block mb-1" style="font-size:11px;">${data.sender}</small>${data.text}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }
    document.getElementById('btn-send-group').addEventListener('click', async () => {
        const input = document.getElementById('input-group-msg'); const text = input.value.trim(); if (!text) return;
        await addDoc(collection(db, "group_messages"), { sender: currentUserEmail, text: text, timestamp: Date.now() }); input.value = "";
    });

    // ================= 加解密邏輯 =================
    function encryptMessage(message, receiverPublicKeyPem) {
        const aesKey = CryptoJS.lib.WordArray.random(32); const iv = CryptoJS.lib.WordArray.random(16);
        const encrypted = CryptoJS.AES.encrypt(message, aesKey, { iv: iv, mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding });
        const encryptedTextBytes = CryptoJS.enc.Base64.parse(encrypted.toString()); const encryptor = new JSEncrypt();
        encryptor.setPublicKey(receiverPublicKeyPem); const encryptedAesKeyStr = encryptor.encrypt(CryptoJS.enc.Hex.stringify(aesKey));
        return CryptoJS.enc.Base64.stringify(iv.clone().concat(CryptoJS.enc.Base64.parse(encryptedAesKeyStr)).concat(encryptedTextBytes));
    }
    function decryptMessage(cipherPackageBase64, myPrivateKeyPem) {
        if (!myPrivateKeyPem) throw new Error();
        const combinedHex = CryptoJS.enc.Hex.stringify(CryptoJS.enc.Base64.parse(cipherPackageBase64));
        const ivHex = combinedHex.substring(0, 32); const encAesKeyHex = combinedHex.substring(32, 32 + 512); const encTextHex = combinedHex.substring(32 + 512);
        const decryptor = new JSEncrypt(); decryptor.setPrivateKey(myPrivateKeyPem);
        const decryptedAesKeyHex = decryptor.decrypt(CryptoJS.enc.Base64.stringify(CryptoJS.enc.Hex.parse(encAesKeyHex)));
        const decrypted = CryptoJS.AES.decrypt(CryptoJS.enc.Base64.stringify(CryptoJS.enc.Hex.parse(encTextHex)), CryptoJS.enc.Hex.parse(decryptedAesKeyHex), { iv: CryptoJS.enc.Hex.parse(ivHex), mode: CryptoJS.mode.CFB, padding: CryptoJS.pad.NoPadding });
        return decrypted.toString(CryptoJS.enc.Utf8);
    }
    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function startPMChatListener() {
        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('chat-pm-box'); box.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.sender_email === currentUserEmail || data.receiver_uid === currentUserUid) {
                    const isMe = data.sender_email === currentUserEmail; let displayMsg = "";
                    try {
                        let decrypted = decryptMessage(data.encrypted_text, localPrivateKey);
                        displayMsg = isMe ? `🔒 (經加密送出) <br> <span class="text-light" style="font-size:12px; opacity:0.55;">原始明文：${escapeHtml(decrypted)}</span>` : escapeHtml(decrypted);
                    } catch(e) { displayMsg = "<span class='text-danger' style='font-size:13px;'>❌ 無法解密 (請提供正確私鑰)</span>"; }
                    box.innerHTML += `<div class="msg-item ${isMe ? 'msg-out' : 'msg-in'}"><small class="text-secondary d-block mb-1" style="font-size:10px;">${data.sender_email}</small>${displayMsg}</div>`;
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }
    document.getElementById('btn-send-pm').addEventListener('click', async () => {
        const targetEmail = document.getElementById('pm-target-email').value.trim(); const input = document.getElementById('input-pm-msg'); const text = input.value.trim(); if (!targetEmail || !text) return;
        const q = query(collection(db, "users"), where("email", "==", targetEmail)); const snapshot = await getDocs(q);
        let targetUid = null, targetPubKey = null; snapshot.forEach((doc) => { targetUid = doc.id; targetPubKey = doc.data().public_key; });
        if (!targetPubKey) { alert("找不到目標對象的加密公鑰！"); return; }
        const encPack = encryptMessage(text, targetPubKey);
        await addDoc(collection(db, "messages"), { sender_email: currentUserEmail, receiver_uid: targetUid, encrypted_text: encPack, timestamp: Date.now() }); input.value = "";
    });
    document.getElementById('btn-download-key').addEventListener('click', () => {
        const blob = new Blob([localPrivateKey], { type: "text/plain;charset=utf-8" }); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = "breeze_private_key.txt"; a.click();
    });
</script>
