<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微風Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #4285f4, #34a853); margin:0; padding:0; height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { background:white; padding:40px; border-radius:12px; width:380px; box-shadow:0 10px 30px rgba(0,0,0,0.2); text-align:center; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
        .btn { width:100%; padding:12px; margin:10px 0; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        .btn-primary { background:#4285f4; color:white; }
        .btn-secondary { background:#f1f3f4; color:#333; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌬️ 微風Chat</h1>
        <p>安全加密即時聊天</p>

        <div id="registerStep">
            <input type="email" id="regEmail" placeholder="電子郵件地址">
            <input type="password" id="regPassword" placeholder="設定密碼 (至少6位)">
            <input type="password" id="masterPass" placeholder="主密碼 (保護私鑰)">
            <button class="btn btn-primary" onclick="sendVerification()">寄送驗證碼</button>
        </div>

        <div id="verifyStep" style="display:none;">
            <input type="text" id="verifyCode" placeholder="輸入6位數驗證碼" maxlength="6">
            <button class="btn btn-primary" onclick="verifyAndRegister()">確認驗證碼</button>
        </div>

        <p><a href="#" onclick="toggleToLogin()">已有帳號？登入</a></p>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBMxdzzFR7wuocXEMOYciw2PPJleuRevOw",
          authDomain: "weifengai-ef11f.firebaseapp.com",
          databaseURL: "https://weifengai-ef11f-default-rtdb.firebaseio.com",
          projectId: "weifengai-ef11f",
          storageBucket: "weifengai-ef11f.firebasestorage.app",
          messagingSenderId: "474059699642",
          appId: "1:474059699642:web:b40a3d32be1cd583199983"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // === Mailjet 金鑰 ===
        const MAILJET_API_KEY = "5d0a3c80279acbe7a4ca24543229c99b";
        const MAILJET_SECRET_KEY = "aee77c713995752689aa19a1ee05efe7";

        async function sendVerification() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const masterPass = document.getElementById('masterPass').value.trim();

            if (!email || password.length < 6 || masterPass.length < 4) {
                return alert("請填寫完整資訊");
            }

            const code = Math.floor(100000 + Math.random() * 900000).toString();

            // 存到 Firebase
            await db.ref('verification/' + btoa(email)).set({
                code: code,
                password: password,
                masterPass: masterPass,
                expires: Date.now() + 600000
            });

            // 寄信
            try {
                const res = await fetch("https://api.mailjet.com/v3.1/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Basic " + btoa(MAILJET_API_KEY + ":" + MAILJET_SECRET_KEY)
                    },
                    body: JSON.stringify({
                        "Messages": [{
                            "From": { "Email": "noreply@weifengchat.com", "Name": "微風Chat" },
                            "To": [{ "Email": email }],
                            "Subject": "🌬️ 微風Chat 驗證碼",
                            "HTMLPart": `<h2>您的驗證碼是 <strong>${code}</strong></h2><p>10分鐘內有效</p>`
                        }]
                    })
                });

                if (res.ok) {
                    alert(`驗證碼已寄至 ${email}！請查看信箱（含垃圾信）`);
                    document.getElementById('registerStep').style.display = 'none';
                    document.getElementById('verifyStep').style.display = 'block';
                } else {
                    alert("寄信失敗，請稍後再試");
                }
            } catch (e) {
                alert("寄信錯誤：" + e.message);
            }
        }

        async function verifyAndRegister() {
            const email = document.getElementById('regEmail').value.trim();
            const inputCode = document.getElementById('verifyCode').value.trim();

            const snap = await db.ref('verification/' + btoa(email)).once('value');
            const data = snap.val();

            if (!data || data.code !== inputCode || Date.now() > data.expires) {
                return alert("驗證碼錯誤或已過期");
            }

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, data.password);
                await cred.user.sendEmailVerification();

                alert("✅ 註冊成功！請登入後使用主密碼解鎖私鑰。");
                // 可在此繼續開發登入流程
            } catch (e) {
                alert("註冊失敗: " + e.message);
            }
        }

        function toggleToLogin() {
            alert("登入功能開發中...（可先用註冊測試）");
        }
    </script>
</body>
</html>
